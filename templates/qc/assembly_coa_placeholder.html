<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COA 报告已迁移 - {{ order.batch_no }}</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/font/bootstrap-icons.css') }}" rel="stylesheet">
    <style>
        body {
            padding: 48px;
            background: #f5f8fb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .placeholder-card {
            max-width: 760px;
            margin: 8vh auto 0;
            border: 1px dashed rgba(30, 58, 95, 0.28);
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(30, 58, 95, 0.08);
        }
    </style>
</head>
<body>
    <div class="text-end mb-3">
        <a class="btn btn-secondary" href="{{ url_for('qc.assembly_outbound_list') }}">
            <i class="bi bi-x-lg"></i> 关闭
        </a>
    </div>
    <div class="placeholder-card p-5 text-center">
        <div class="text-primary mb-3"><i class="bi bi-file-earmark-medical" style="font-size: 3rem;"></i></div>
        <h1 class="h3 mb-3">COA 报告已迁移到出厂模块</h1>
        <p class="text-muted mb-4">批次编号：{{ order.batch_no }}，产品名称：{{ order.product_name_snapshot }}</p>
        <p class="mb-0">请在出厂订单的已完成批次中点击“打印 COA 报告”。</p>
        <p class="text-muted small mt-4">生成时间：{{ current_time }}</p>
    </div>
</body>
</html>
