<div class="attachment-item component-item" data-index="{{ row_index }}">
    <div class="attachment-toolbar mb-3">
        <h6 class="fw-bold mb-0">配件 {{ row_index + 1 }}</h6>
        <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeComponentRow(this)">
            <i class="bi bi-trash"></i> 删除
        </button>
    </div>
    <div class="row g-3">
        <div class="col-lg-5">
            <label class="form-label">工件库下拉选择 <span class="text-danger">*</span></label>
            <select class="form-select component-workpiece-select" name="component_workpiece_select_{{ row_index }}">
                <option value="">-- 请选择工件 --</option>
                {% for workpiece in workpiece_choices %}
                <option
                    value="{{ workpiece.id }}"
                    data-code="{{ workpiece.workpiece_code }}"
                    data-name="{{ workpiece.workpiece_name }}"
                    data-type="{{ workpiece.workpiece_type_display }}"
                    data-stock="{{ '{:g}'.format(workpiece.stock_quantity or 0) }}"
                    {% if selected_workpiece_id == workpiece.id %}selected{% endif %}
                >
                    {{ workpiece.workpiece_code }} / {{ workpiece.workpiece_name }}（库存 {{ '{:g}'.format(workpiece.stock_quantity or 0) }}）
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-lg-4">
            <label class="form-label">模糊搜索</label>
            <div class="component-search-wrap">
                <input type="hidden" name="component_workpiece_id_{{ row_index }}" value="{{ selected_workpiece_id }}">
                <input type="text" class="form-control component-search-input" name="component_workpiece_display_{{ row_index }}" value="{{ selected_display }}" placeholder="输入工件编号或名称联想" autocomplete="off">
                <input type="hidden" name="component_workpiece_code_{{ row_index }}" value="{{ component.workpiece_code_snapshot if component else '' }}">
                <input type="hidden" name="component_workpiece_name_{{ row_index }}" value="{{ component.workpiece_name_snapshot if component else '' }}">
                <div class="component-suggestions"></div>
            </div>
        </div>
        <div class="col-lg-3">
            <label class="form-label">数量 <span class="text-danger">*</span></label>
            <input type="number" step="0.0001" min="0.0001" class="form-control" name="component_quantity_{{ row_index }}" value="{{ component.quantity_per_unit if component else '' }}" required>
        </div>
    </div>
</div>
