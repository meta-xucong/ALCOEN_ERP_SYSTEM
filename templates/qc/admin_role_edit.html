{% extends 'qc/base.html' %}

{% block title %}编辑角色权限 - ALCOEN AI CATS{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0"><i class="bi bi-pencil-square"></i> 编辑角色权限</h1>
    <a href="{{ url_for('qc.qc_admin_roles') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> 返回角色权限色权限色权限
    </a>
</div>

<div class="card mb-4">
    <div class="card-body">
        <div class="row">
            <div class="col-md-4"><strong>角色名称：</strong>{{ role.name }}</div>
            <div class="col-md-4"><strong>角色代码：</strong><code>{{ role.code }}</code></div>
            <div class="col-md-4"><strong>描述：</strong>{{ role.description or '-' }}</div>
        </div>
    </div>
</div>

<form method="POST">
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="bi bi-check2-square"></i> 选择权限</h5>
        </div>
        <div class="card-body">
            <div class="row">
                {% for perm_code, perm_name in permissions.items() %}
                <div class="col-md-4 mb-2">
                    <label class="form-check-label d-flex align-items-center gap-2">
                        <input class="form-check-input" type="checkbox" name="permissions" value="{{ perm_code }}"
                               {% if perm_code in current_permissions %}checked{% endif %}>
                        <span>{{ perm_name }}</span>
                        <code class="small text-muted">{{ perm_code }}</code>
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="card-footer d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> 保存权限
            </button>
            <a href="{{ url_for('qc.qc_admin_roles') }}" class="btn btn-outline-secondary">取消</a>
        </div>
    </div>
</form>
{% endblock %}
