<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCOEN - 选择系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/theme-preferences.css') }}" rel="stylesheet">
    <style>
        :root {
            --alco-primary: #1e3a5f;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, #e8f4f8 0%, #d4e9f2 50%, #c5e0ec 100%);
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(245, 247, 250, 0.1) 0%, rgba(235, 238, 242, 0.08) 50%, rgba(240, 242, 245, 0.1) 100%);
            backdrop-filter: blur(2px) saturate(105%);
            -webkit-backdrop-filter: blur(2px) saturate(105%);
            z-index: -1;
            pointer-events: none;
        }
        
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            pointer-events: none;
            z-index: -1;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(74, 144, 217, 0.5) 0%, rgba(74, 144, 217, 0) 70%);
            top: -100px;
            right: -100px;
        }
        
        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(192, 192, 192, 0.4) 0%, rgba(192, 192, 192, 0) 70%);
            bottom: -50px;
            left: -50px;
        }
        
        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(30, 58, 95, 0.3) 0%, rgba(30, 58, 95, 0) 70%);
            top: 50%;
            left: 30%;
        }
        
        .portal-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .portal-header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .portal-header img {
            height: 60px;
            margin-bottom: 20px;
        }
        
        .portal-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--alco-primary);
            margin-bottom: 8px;
        }
        
        .portal-header p {
            color: rgba(30, 58, 95, 0.6);
            font-size: 16px;
        }
        
        .system-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(24px) saturate(200%) brightness(1.05);
            -webkit-backdrop-filter: blur(24px) saturate(200%) brightness(1.05);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(30, 58, 95, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }
        
        .system-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 16px 48px rgba(30, 58, 95, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        
        .system-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
        }
        
        .system-icon.erp {
            background: linear-gradient(135deg, rgba(30, 58, 95, 0.15) 0%, rgba(42, 80, 128, 0.2) 100%);
            color: var(--alco-primary);
        }
        
        .system-icon.qc {
            background: linear-gradient(135deg, rgba(25, 135, 84, 0.15) 0%, rgba(32, 168, 104, 0.2) 100%);
            color: #198754;
        }
        
        .system-card h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--alco-primary);
            margin-bottom: 12px;
        }
        
        .system-card p {
            color: rgba(30, 58, 95, 0.6);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .btn-enter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            transition: all 0.2s ease;
        }
        
        .btn-enter.erp {
            background: linear-gradient(135deg, rgba(30, 58, 95, 0.9) 0%, rgba(42, 80, 128, 0.95) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.2);
        }
        
        .btn-enter.erp:hover {
            background: linear-gradient(135deg, rgba(42, 80, 128, 0.95) 0%, rgba(30, 58, 95, 0.95) 100%);
            color: white;
        }
        
        .btn-enter.qc {
            background: linear-gradient(135deg, rgba(25, 135, 84, 0.9) 0%, rgba(32, 168, 104, 0.95) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }
        
        .btn-enter.qc:hover {
            background: linear-gradient(135deg, rgba(32, 168, 104, 0.95) 0%, rgba(25, 135, 84, 0.95) 100%);
            color: white;
        }
        
        .footer {
            text-align: center;
            margin-top: 50px;
            color: rgba(30, 58, 95, 0.5);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    
    <div class="portal-container">
        <div class="portal-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="ALCOEN">
            <h1>ALCOEN 管理平台</h1>
            <p>请选择您要进入的子系统</p>
        </div>
        
        <div class="row g-4 justify-content-center">
            <div class="col-md-5">
                <a href="{{ url_for('auth.login') }}" class="system-card">
                    <div class="system-icon erp">
                        <i class="bi bi-building"></i>
                    </div>
                    <h3>企业资源计划管理系统</h3>
                    <p>订单管理、合同跟踪、对账单生成、产品库维护等核心业务功能</p>
                    <span class="btn-enter erp">
                        <i class="bi bi-box-arrow-in-right"></i> 进入系统
                    </span>
                </a>
            </div>
            <div class="col-md-5">
                <a href="{{ url_for('auth.qc_login') }}" class="system-card">
                    <div class="system-icon qc">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h3>质量控制系统</h3>
                    <p>工件订单质控、质量检测、验收确认及验收清单打印等质量管理功能</p>
                    <span class="btn-enter qc">
                        <i class="bi bi-box-arrow-in-right"></i> 进入系统
                    </span>
                </a>
            </div>
        </div>
        
        <div class="footer">
            <p>&copy; 2026 ALCOEN. All rights reserved.</p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
