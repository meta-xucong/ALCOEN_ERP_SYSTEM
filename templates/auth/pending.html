<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等待审核 - ALCOEN ERP</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/font/bootstrap-icons.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pending-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        .pending-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px 40px;
            text-align: center;
        }
        .pending-icon {
            font-size: 80px;
            color: #ffc107;
            margin-bottom: 25px;
        }
        .pending-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }
        .pending-desc {
            color: #666;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .btn-back {
            padding: 12px 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
            color: white;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="pending-container">
        <div class="pending-card">
            <div class="pending-icon">
                <i class="bi bi-hourglass-split"></i>
            </div>
            <h1 class="pending-title">注册申请已提交</h1>
            <p class="pending-desc">
                您的账号注册申请已提交成功！<br>
                请耐心等待管理员审核，审核通过后即可登录系统。<br>
                如有疑问，请联系系统管理员。
            </p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-back">
                <i class="bi bi-arrow-left"></i> 返回登录页
            </a>
        </div>
        
        <div class="footer">
            <p>&copy; 2024 ALCOEN. All rights reserved.</p>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
