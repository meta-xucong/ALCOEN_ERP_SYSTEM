{% extends 'base.html' %}

{% block title %}个人资料 - ALCOEN ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-person-circle"></i> 个人资料</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" value="{{ user.username }}" disabled>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">角色</label>
                        <input type="text" class="form-control" value="{{ user.role.name }}" disabled>
                    </div>
                    
                    {% if user.department %}
                    <div class="mb-3">
                        <label class="form-label">所属部门</label>
                        <input type="text" class="form-control" value="{{ user.department.name }}" disabled>
                    </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label for="real_name" class="form-label">真实姓名</label>
                        <input type="text" class="form-control" id="real_name" name="real_name" 
                               value="{{ user.real_name or '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" name="email" 
                               value="{{ user.email or '' }}">
                    </div>
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label">电话</label>
                        <input type="tel" class="form-control" id="phone" name="phone" 
                               value="{{ user.phone or '' }}">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">最后登录时间</label>
                        <input type="text" class="form-control" 
                               value="{{ user.last_login_at.strftime('%Y-%m-%d %H:%M:%S') if user.last_login_at else '从未登录' }}" disabled>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">最后登录IP</label>
                        <input type="text" class="form-control" 
                               value="{{ user.last_login_ip or '-' }}" disabled>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 保存
                        </button>
                        <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline-info">
                            <i class="bi bi-key"></i> 修改密码
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
